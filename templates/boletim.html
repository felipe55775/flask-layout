{% extends "layout.html" %}

{% block main %}
    <section class="boletim">
        <h1>Boletim Escolar</h1>

        <div class="boletim-box">
            <table>
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>Nota</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Português</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Matemática</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>História</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Geografia</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Física</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Química</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Biologia</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Inglês</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Educação Física</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                    <tr><td>Sociologia</td><td><input type="number" min="0" max="10" step="0.1" placeholder="0.0"></td></tr>
                </tbody>
            </table>

            <aside class="resumo">
                <h2>Resumo</h2>
                <p>Digite suas notas e acompanhe o desempenho por matéria.</p>
                <div class="card-box">
                    <label for="media">Média geral</label>
                    <input id="media" type="text" placeholder="Ex.: 8,5">
                </div>
                <div class="card-box">
                    <label for="situacao">Situação</label>
                    <input id="situacao" type="text" placeholder="Aprovado / Recuperação">
                </div>
            </aside>
        </div>
    </section>
{% endblock %}
